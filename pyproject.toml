[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "referral-gnn"
version = "0.1.0"
description = "Specialist recommendation for PCP referrals on a heterogeneous graph (HGT), judged on quality, load, fit and travel"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.setuptools]
packages = ["referral_gnn"]
